apiVersion: apps/v1
kind: Deployment
metadata:
  name: mywebsite-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mywebsite
  template:
    metadata:
      labels:
        app: mywebsite
    spec:
      containers:
        - name: mywebsite
          image: mywebsite:v1      # тот образ, который мы загрузили в minikube
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

